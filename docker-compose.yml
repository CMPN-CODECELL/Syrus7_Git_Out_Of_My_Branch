# docker-compose.yml (Local Development)
# Postgres and Redis run inside the container and are NOT published to the host.
# Only the app port is exposed. Use `docker compose exec app psql ...` / `redis-cli` for debugging.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kraken-app:dev
    ports:
      - '127.0.0.1:8000:8000'
    env_file: .env
    restart: unless-stopped
    volumes:
      - .:/app
      - pg_data:/var/lib/postgresql/data
      - redis_data:/var/lib/redis
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          memory: 1G

volumes:
  redis_data:
  pg_data:
