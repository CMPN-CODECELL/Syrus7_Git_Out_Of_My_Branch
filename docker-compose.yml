# docker-compose.yml (Local Development)
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexusquant-app:dev
    ports: 
      - '8000:8000'
      - '5433:5432'
      - '6379:6379'
    env_file: .env
    restart: unless-stopped
    volumes: 
      - .:/app
      - pg_data:/var/lib/postgresql/data
      - redis_data:/var/lib/redis
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          memory: 1G

volumes:
  redis_data:
  pg_data:
