[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:redis]
command=redis-server --bind 127.0.0.1 --protected-mode yes --requirepass %(ENV_REDIS_PASSWORD)s
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:postgres]
command=/usr/lib/postgresql/15/bin/postgres -D /var/lib/postgresql/data
user=postgres
autostart=true
autorestart=true
priority=20
environment=LANG="C.UTF-8",LC_ALL="C.UTF-8"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Exactly ONE uvicorn worker. It owns the single 021 login and the market socket.
; A second worker would log in again and revoke the first worker's 021 token.
[program:app]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --loop uvloop
directory=/app
autostart=true
autorestart=true
priority=30
environment=PYTHONUNBUFFERED="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Celery runs analysis jobs only (price polling, candle backfill). Nothing in Celery talks to 021.
[program:celery]
command=celery -A shared.infrastructure.celery_app:celery_app worker -Q celery,ingestion,analytics -l info
directory=/app
autostart=true
autorestart=true
priority=40
environment=PYTHONUNBUFFERED="1",PYTHONPATH="/app"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:celery-beat]
command=celery -A shared.infrastructure.celery_app:celery_app beat -l info --schedule /tmp/celerybeat-schedule
directory=/app
autostart=true
autorestart=true
priority=45
environment=PYTHONUNBUFFERED="1",PYTHONPATH="/app"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ingestion-orchestrator]
command=python3 domains/ingestion/application/services/orchestrators/ingestion_orchestrator_service.py
directory=/app
autostart=true
autorestart=true
priority=56
environment=PYTHONUNBUFFERED="1",PYTHONPATH="/app"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
