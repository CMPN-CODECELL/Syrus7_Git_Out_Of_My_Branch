[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:redis]
command=redis-server --bind 127.0.0.1 --protected-mode yes
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:postgres]
command=/usr/lib/postgresql/15/bin/postgres -D /var/lib/postgresql/data
user=postgres
autostart=true
autorestart=true
priority=20
environment=LANG="C.UTF-8",LC_ALL="C.UTF-8"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:app]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --loop uvloop
directory=/app
autostart=true
autorestart=true
priority=30
environment=PYTHONUNBUFFERED="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:celery]
command=celery -A shared.infrastructure.celery_app:celery_app worker -Q celery,ingestion,analytics -l info
directory=/app
autostart=true
autorestart=true
priority=40
environment=PYTHONUNBUFFERED="1",PYTHONPATH="/app"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:celery-beat]
command=celery -A shared.infrastructure.celery_app:celery_app beat -l info
directory=/app
autostart=true
autorestart=true
priority=45
environment=PYTHONUNBUFFERED="1",PYTHONPATH="/app"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ingestion-orchestrator]
command=python3 domains/ingestion/application/services/orchestrators/ingestion_orchestrator_service.py
directory=/app
autostart=true
autorestart=true
priority=56
environment=PYTHONUNBUFFERED="1",PYTHONPATH="/app"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:options-subscriber]
command=python3 domains/analytics/infrastructure/options_subscriber.py
directory=/app
autostart=true
autorestart=true
priority=60
environment=PYTHONUNBUFFERED="1",PYTHONPATH="/app"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:notification-subscriber]
command=python3 domains/notifications/infrastructure/subscribers/notification_subscriber.py
directory=/app
autostart=true
autorestart=true
priority=70
environment=PYTHONUNBUFFERED="1",PYTHONPATH="/app"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
