<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · Kraken</title>
    <link rel="icon" href="/kraken-favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="login.css">
<link rel="stylesheet" href="/kraken-theme.css?v=1">
<script src="/kraken-theme.js?v=1"></script>
</head>
<body>
    <div class="split-layout">
        <!-- Left Panel: Authentication -->
        <div class="auth-panel">
            <div class="auth-content" style="max-width: 400px; text-align: center;">
                <div class="header">
                    <img src="/kraken-logo.png" alt="Kraken" style="width: 64px; height: 64px; margin-bottom: 12px;">
                    <h1>Welcome to Kraken</h1>
                    <p style="margin-top: 10px; margin-bottom: 30px;">Sign in to your AI trading copilot.</p>
                </div>
                <div id="authNotice" role="alert" hidden style="margin-bottom: 1rem; padding: 0.75rem; border-radius: 0.375rem; background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; font-size: 0.875rem; text-align: left;"></div>

                <form id="emailLoginForm" style="display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem;">
                    <div style="text-align: left;">
                        <label for="emailInput" style="display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; color: #374151;">Email</label>
                        <input type="email" id="emailInput" required placeholder="you@example.com" style="width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 0.375rem; font-family: inherit;">
                    </div>
                    <div style="text-align: left;">
                        <label for="passwordInput" style="display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; color: #374151;">Password</label>
                        <input type="password" id="passwordInput" required placeholder="••••••••" style="width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 0.375rem; font-family: inherit;">
                    </div>
                    <div style="display: flex; gap: 1rem;">
                        <button type="submit" class="primary-btn" style="flex: 1; justify-content: center;">Sign In</button>
                        <button type="button" id="signUpBtn" class="primary-btn" style="flex: 1; justify-content: center; background-color: #1f2937; color: white;">Sign Up</button>
                    </div>
                </form>

                <div style="display: flex; align-items: center; margin-bottom: 2rem;">
                    <div style="flex: 1; height: 1px; background-color: #e5e7eb;"></div>
                    <span style="padding: 0 1rem; color: #6b7280; font-size: 0.875rem;">Or continue with</span>
                    <div style="flex: 1; height: 1px; background-color: #e5e7eb;"></div>
                </div>

                <div class="social-logins" style="margin-bottom: 2rem;">
                    <!-- Expanded Google Button -->
                    <button class="primary-btn" id="googleLoginBtn" style="justify-content: center;">
                        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg" alt="Google" />
                        Google
                    </button>
                </div>

                <p class="footer-text">
                    Join the millions of smart investors who trust us to manage their finances. Log in to track your portfolio performance and make informed investment decisions.
                </p>
            </div>
        </div>

        <!-- Right Panel: Visual Showcase -->
        <div class="visual-panel">
            <div class="decoration dec-1"></div>
            <div class="decoration dec-2"></div>
            <div class="decoration dec-3"></div>
            <div class="decoration dec-4"></div>
            <!-- Original Image -->
            <img src="bull_image.png" alt="3D Finance Bull" class="hero-image">
        </div>
    </div>
    
    <!-- Supabase Integration -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/supabaseClient.js"></script>
    <script>
        // "Failed to fetch" means the browser could not reach Supabase at all (wrong or deleted
        // project URL, network, blocked by an extension), not a wrong password.
        function authErrorText(action, error) {
            const msg = (error && error.message) || String(error);
            if (/failed to fetch|networkerror|load failed/i.test(msg)) {
                return `${action} failed: can't reach the sign-in service (Supabase). Check that supabaseUrl in .env is your project's URL (Supabase dashboard → Project Settings → API), then restart the app.`;
            }
            return `${action} failed: ${msg}`;
        }

        function showNotice(text) {
            const box = document.getElementById('authNotice');
            box.textContent = text;
            box.hidden = false;
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const supabase = await initSupabase();
            if (!supabase) {
                showNotice("Sign-in is not configured: the server returned no Supabase URL or key. Set supabaseUrl and supabaseKey in .env and restart the app.");
                return;
            }
            
            // Check if user is already logged in
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                window.location.href = '/dashboard.html';
                return;
            }

            document.getElementById('googleLoginBtn').addEventListener('click', async () => {
                const { error } = await supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: window.location.origin + '/dashboard.html'
                    }
                });

                if (error) {
                    console.error(error);
                    showNotice(authErrorText("Google sign-in", error));
                }
            });

            document.getElementById('emailLoginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('emailInput').value;
                const password = document.getElementById('passwordInput').value;
                
                const { error } = await supabase.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) {
                    console.error(error);
                    showNotice(authErrorText("Sign in", error));
                } else {
                    window.location.href = '/dashboard.html';
                }
            });

            document.getElementById('signUpBtn').addEventListener('click', async () => {
                const email = document.getElementById('emailInput').value;
                const password = document.getElementById('passwordInput').value;
                
                if (!email || !password) {
                    showNotice("Enter both email and password to sign up.");
                    return;
                }

                const { data, error } = await supabase.auth.signUp({
                    email,
                    password
                });

                if (error) {
                    console.error(error);
                    showNotice(authErrorText("Sign up", error));
                } else if (data && data.session) {
                    window.location.href = '/dashboard.html';   // email confirmation is off: signed in already
                } else {
                    alert("Account created. Check your email for the confirmation link, then sign in.");
                }
            });
        });
    </script>
</body>
</html>
